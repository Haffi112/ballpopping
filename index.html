              megaBallAvailable: false
            };
            // Increment games played
            state.stats.gamesPlayed++;
          }

          state.numballs = LevelSystem.calculateBallCount(level);
          state.target = LevelSystem.calculateTarget(level, state.numballs);

          // For precision mode, target is slightly higher but exact
          if (state.gameMode === 'precision') {
            state.target = Math.min(Math.ceil(state.numballs * 0.5), state.numballs - 1);
          }

          const options = LevelSystem.getBallOptions(level);
          const theme = THEMES[state.settings.theme];
          const specialChance = LevelSystem.getSpecialBallChance(level);

          // Create balls
          for (let i = 0; i < state.numballs; i++) {
            const x = CONFIG.BASE_RADIUS + Math.random() * (state.width - 2 * CONFIG.BASE_RADIUS);
            const y = CONFIG.BASE_RADIUS + Math.random() * (state.height - 2 * CONFIG.BASE_RADIUS);
            const color = theme.ballColors[Math.floor(Math.random() * theme.ballColors.length)];

            // Determine if this should be a special ball
            const isSpecial = Math.random() < specialChance;
            const ballType = isSpecial ? LevelSystem.getRandomSpecialType() : 'normal';

            const ball = new Ball(x, y, false, {
              ...options,
              color,
              type: ballType
            });
            state.balls.push(ball);
          }

          state.gameState = 'playing';
        },

        startTimeAttack() {
          state.level = 1;
          state.clicks = 0;
          state.numPopped = 0;
          state.combo = 0;
          state.maxCombo = 0;
          state.lastPopTime = 0;
          state.score = 0;
          state.balls = [];
          state.particles = [];
          state.ripples = [];
          state.floatingTexts = [];
          state.confetti = [];
          state.timeRemaining = CONFIG.TIME_ATTACK_DURATION;
          state.timeAttackScore = 0;

          state.screenShake = { active: false, intensity: 0, duration: 0, startTime: 0 };
          state.slowMo = { active: false, factor: 1, duration: 0, startTime: 0 };

          state.numballs = 20;
          state.target = 999; // No real target

          state.stats.gamesPlayed++;

          this.spawnTimeAttackBalls();

          state.gameState = 'playing';
        },

        spawnTimeAttackBalls() {
          const theme = THEMES[state.settings.theme];

          // Spawn more balls if too few
          while (state.balls.filter(b => !b.isDead && !b.isActive).length < 15) {
            const x = CONFIG.BASE_RADIUS + Math.random() * (state.width - 2 * CONFIG.BASE_RADIUS);
            const y = CONFIG.BASE_RADIUS + Math.random() * (state.height - 2 * CONFIG.BASE_RADIUS);
            const color = theme.ballColors[Math.floor(Math.random() * theme.ballColors.length)];

            const isSpecial = Math.random() < 0.15;
            const ballType = isSpecial ? LevelSystem.getRandomSpecialType() : 'normal';

            const ball = new Ball(x, y, false, {
              color,
              type: ballType,
              speedMultiplier: 1.2
            });
            state.balls.push(ball);
          }
        },

        startZenMode() {
          state.level = 1;
          state.clicks = 0;
          state.numPopped = 0;
          state.combo = 0;
          state.maxCombo = 0;
          state.lastPopTime = 0;
          state.score = 0;
          state.balls = [];
          state.particles = [];
          state.ripples = [];
          state.floatingTexts = [];
          state.confetti = [];

          state.screenShake = { active: false, intensity: 0, duration: 0, startTime: 0 };
          state.slowMo = { active: false, factor: 1, duration: 0, startTime: 0 };

          state.numballs = 30;
          state.target = 0; // No target in zen mode

          this.spawnZenBalls();

          state.gameState = 'playing';
        },

        spawnZenBalls() {
          const theme = THEMES[state.settings.theme];

          while (state.balls.filter(b => !b.isDead && !b.isActive).length < 25) {
            const x = CONFIG.BASE_RADIUS + Math.random() * (state.width - 2 * CONFIG.BASE_RADIUS);
            const y = CONFIG.BASE_RADIUS + Math.random() * (state.height - 2 * CONFIG.BASE_RADIUS);
            const color = theme.ballColors[Math.floor(Math.random() * theme.ballColors.length)];

            const ball = new Ball(x, y, false, {
              color,
              speedMultiplier: 0.7 // Slower, more relaxing
            });
            state.balls.push(ball);
          }
        },

        triggerScreenShake(intensity = CONFIG.SCREEN_SHAKE_INTENSITY) {
          state.screenShake = {
            active: true,
            intensity: intensity,
            duration: CONFIG.SCREEN_SHAKE_DURATION,
            startTime: Date.now()
          };
        },

        triggerSlowMo(factor = 0.3, duration = 1500) {
          state.slowMo = {
            active: true,
            factor: factor,
            duration: duration,
            startTime: Date.now()
          };
        },

        spawnConfetti() {
          const theme = THEMES[state.settings.theme];
          for (let i = 0; i < 50; i++) {
            const x = Math.random() * state.width;
            const y = state.height * 0.3;
            const color = theme.ballColors[Math.floor(Math.random() * theme.ballColors.length)];
            state.confetti.push(new Confetti(x, y, color));
          }
        },

        update(dt) {
          if (state.gameState !== 'playing') return;

          // Update screen shake
          if (state.screenShake.active) {
            if (Date.now() - state.screenShake.startTime > state.screenShake.duration) {
              state.screenShake.active = false;
            }
          }

          // Update slow-mo
          if (state.slowMo.active) {
            if (Date.now() - state.slowMo.startTime > state.slowMo.duration) {
              state.slowMo.active = false;
              state.slowMo.factor = 1;
            }
          }

          // Time attack countdown
          if (state.gameMode === 'timeAttack') {
            state.timeRemaining -= dt / 1000;
            if (state.timeRemaining <= 0) {
              state.timeRemaining = 0;
              this.endTimeAttack();
              return;
            }
            // Respawn balls in time attack
            this.spawnTimeAttackBalls();
          }

          // Zen mode respawning
          if (state.gameMode === 'zen') {
            this.spawnZenBalls();
            // Allow multiple clicks in zen mode
            const anyActive = state.balls.some(ball => ball.isActive);
            if (!anyActive && state.clicks > 0) {
              state.clicks = 0;
            }
          }

          // Update balls
          state.balls.forEach(ball => ball.update(dt, state.width, state.height));

          // Check collisions and activate balls
          if (state.clicks > 0 || state.gameMode === 'timeAttack' || state.gameMode === 'zen') {
            const ballsToActivate = [];

            state.balls.forEach(ball => {
              if (!ball.isActive && !ball.isDead) {
                state.balls.forEach(other => {
                  if (other.isActive && other.radius > 0 && ball.collidesWith(other)) {
                    ballsToActivate.push(ball);
                  }
                });
              }
            });

            ballsToActivate.forEach(ball => {
              if (ball.isActive) return; // Already activated
              ball.isActive = true;
              state.numPopped++;

              // Combo system
              const now = Date.now();
              if (now - state.lastPopTime < CONFIG.COMBO_WINDOW) {
                state.combo++;
                if (state.combo > state.maxCombo) state.maxCombo = state.combo;
                Audio.playCombo(state.combo);
                if (state.combo > 2) Haptic.combo();

                // Screen shake on big combos
                if (state.combo >= 5) {
                  this.triggerScreenShake(state.combo * 1.5);
                }
              } else {
                state.combo = 1;
              }
              state.lastPopTime = now;

              // Score calculation with point multiplier and streak bonus
              const streakBonus = LevelSystem.getStreakBonus(state.streak);
              const basePoints = Math.floor(10 * state.combo * ball.pointMultiplier * streakBonus);
              state.score += basePoints;
              state.levelScore = (state.levelScore || 0) + basePoints;

              // Update stats
              state.stats.totalPops++;
              state.stats.totalScore += basePoints;
              if (state.combo > state.stats.bestCombo) {
                state.stats.bestCombo = state.combo;
              }

              // Floating score text
              const color = ball.type === 'golden' ? '#ffd700' :
                           ball.type === 'speed' ? '#00ff88' : '#ffffff';
              state.floatingTexts.push(new FloatingText(ball.x, ball.y, `+${basePoints}`, {
                color: color,
                fontSize: basePoints > 50 ? 28 : 20,
                isCombo: state.combo >= 3
              }));

              // Particles
              if (state.settings.particlesEnabled) {
                for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                  state.particles.push(new Particle(ball.x, ball.y, ball.color));
                }
              }

              // Handle bomb ball - create secondary explosion
              if (ball.type === 'bomb' && ball.bombRadius > 0) {
                const bombBall = new Ball(ball.x, ball.y, true, {
                  color: '#ff6600',
                  radius: CONFIG.BASE_RADIUS,
                  maxRadius: ball.bombRadius,
                  type: 'normal'
                });
                state.balls.push(bombBall);
                Audio.playPop(0.5);
              }

              Audio.playPop(0.8 + Math.random() * 0.4);
              Haptic.pop();
            });
          }

          // Update particles
          state.particles = state.particles.filter(p => p.update(dt));

          // Update ripples
          state.ripples = state.ripples.filter(r => r.update(dt));

          // Update floating texts
          state.floatingTexts = state.floatingTexts.filter(t => t.update(dt));

          // Update confetti
          state.confetti = state.confetti.filter(c => c.update(dt));

          // Check level end conditions (not for zen or time attack)
          if (state.gameMode !== 'zen' && state.gameMode !== 'timeAttack' && state.clicks > 0) {
            const anyActive = state.balls.some(ball => ball.isActive);

            if (!anyActive) {
              // Check win/lose conditions
              let won = false;
              if (state.gameMode === 'precision') {
                // Precision mode: must pop EXACTLY the target
                won = state.numPopped === state.target;
              } else {
                won = state.numPopped >= state.target;
              }

              if (won) {
                // Level complete
                state.streak++;
                if (state.streak > state.maxStreak) {
                  state.maxStreak = state.streak;
                }

                // Calculate stars
                state.stars = LevelSystem.calculateStars(state.numPopped, state.numballs);
                state.levelStars[state.level] = Math.max(state.levelStars[state.level] || 0, state.stars);

                // Update unlocks
                if (state.level > state.unlocks.highestLevelReached) {
                  state.unlocks.highestLevelReached = state.level;
                  Storage.saveUnlocks(state.unlocks);
                }
                if (state.level > state.stats.highestLevel) {
                  state.stats.highestLevel = state.level;
                }

                // Trigger slow-mo and confetti
                this.triggerSlowMo(0.3, 1000);
                this.spawnConfetti();

                state.gameState = 'levelComplete';
                Audio.playLevelUp();
                Haptic.levelUp();

                // Update high score
                if (state.score > state.highScore) {
                  state.highScore = state.score;
                  Storage.saveHighScore(state.highScore);
                }

                // Save stats
                Storage.saveStats(state.stats);
              } else {
                // Game over
                state.streak = 0;

                state.gameState = 'gameOver';
                Audio.playGameOver();
                Haptic.gameOver();

                // Update high score
                if (state.score > state.highScore) {
                  state.highScore = state.score;
                  Storage.saveHighScore(state.highScore);
                }

                // Save stats
                Storage.saveStats(state.stats);
              }
            }
          }
        },

        endTimeAttack() {
          state.gameState = 'gameOver';
          Audio.playGameOver();
          Haptic.gameOver();

          // Update high score
          if (state.score > state.highScore) {
            state.highScore = state.score;
            Storage.saveHighScore(state.highScore);
          }

          // Save stats
          Storage.saveStats(state.stats);
        },

        render() {
          const ctx = state.ctx;

          ctx.clearRect(0, 0, state.width, state.height);

          // Apply screen shake
          if (state.screenShake.active) {
            const elapsed = Date.now() - state.screenShake.startTime;
            const progress = elapsed / state.screenShake.duration;
            const intensity = state.screenShake.intensity * (1 - progress);
            const shakeX = (Math.random() - 0.5) * intensity;
            const shakeY = (Math.random() - 0.5) * intensity;
            ctx.save();
            ctx.translate(shakeX, shakeY);
          }

          switch (state.gameState) {
            case 'tutorial':
              UI.drawTutorial(ctx);
              break;
            case 'menu':
              UI.drawMenu(ctx);
              break;
            case 'modeSelect':
              UI.drawModeSelect(ctx);
              break;
            case 'stats':
              UI.drawStats(ctx);
              break;
            case 'playing':
              UI.drawBackground(ctx);
              state.ripples.forEach(r => r.draw(ctx));
              state.balls.forEach(ball => ball.draw(ctx));
              state.particles.forEach(p => p.draw(ctx));
              state.floatingTexts.forEach(t => t.draw(ctx));
              state.confetti.forEach(c => c.draw(ctx));
              UI.drawHUD(ctx);
              break;
            case 'paused':
              UI.drawBackground(ctx);
              state.balls.forEach(ball => ball.draw(ctx));
              UI.drawHUD(ctx);
              UI.drawPauseMenu(ctx);
              break;
            case 'levelComplete':
              UI.drawBackground(ctx);
              state.particles.forEach(p => p.draw(ctx));
              state.confetti.forEach(c => c.draw(ctx));
              UI.drawLevelComplete(ctx);
              break;
            case 'upgradeSelect':
              UI.drawBackground(ctx);
              UI.drawUpgradeSelect(ctx);
              break;
            case 'gameOver':
              UI.drawBackground(ctx);
              UI.drawGameOver(ctx);
              break;
            case 'settings':
              UI.drawSettings(ctx);
              break;
            case 'levelSelect':
              UI.drawLevelSelect(ctx);
              break;
          }

          // Restore from screen shake
          if (state.screenShake.active) {
            ctx.restore();
          }
        },

        loop(timestamp) {
          state.deltaTime = timestamp - state.lastTime;
          state.lastTime = timestamp;

          // Cap delta time to prevent huge jumps
          const dt = Math.min(state.deltaTime, 50);

          this.update(dt);
          this.render();

          requestAnimationFrame((t) => this.loop(t));
        }
      };

      // ============================================
      // POLYFILLS
      // ============================================
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
          if (w < 2 * r) r = w / 2;
          if (h < 2 * r) r = h / 2;
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          this.closePath();
          return this;
        };
      }

      // ============================================
      // START GAME
      // ============================================
      document.addEventListener('DOMContentLoaded', () => {
        Game.init();
      });

    })();
  </script>
</body>
</html>
