<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Pop'em All!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.5s ease;
    }

    #gameCanvas {
      display: block;
      touch-action: none;
    }

    #rotateMessage {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: white;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }

    #rotateMessage .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: rotate 2s ease-in-out infinite;
    }

    #rotateMessage h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #rotateMessage p {
      font-size: 16px;
      opacity: 0.7;
    }

    @keyframes rotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (max-width: 768px) {
      #rotateMessage {
        display: flex;
      }
      #gameCanvas {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="rotateMessage">
    <div class="icon">📱</div>
    <h2>Please Rotate Your Device</h2>
    <p>This game is best played in landscape mode</p>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    // ============================================
    // POP'EM ALL! - A Modern Ball Popping Game
    // ============================================

    (function() {
      'use strict';

      // ============================================
      // CONFIGURATION & CONSTANTS
      // ============================================
      const CONFIG = {
        BASE_BALL_COUNT: 10,
        BALLS_PER_TIER: 5,
        MAX_BALLS: 100,
        BASE_SPEED: 2,
        BASE_RADIUS: 12,
        MAX_RADIUS: 80,
        PARTICLE_COUNT: 12,
        RIPPLE_DURATION: 500,
        COMBO_WINDOW: 800,
        HIGH_SCORE_KEY: 'popemall_highscore',
        SETTINGS_KEY: 'popemall_settings',
        STATS_KEY: 'popemall_stats',
        UNLOCKS_KEY: 'popemall_unlocks',
        TARGET_FPS: 60,
        // Special ball types
        SPECIAL_BALL_TYPES: ['golden', 'bomb', 'frozen', 'speed'],
        // Star rating thresholds
        STAR_THRESHOLDS: { one: 0, two: 0.75, three: 0.90 },
        // Time attack duration (seconds)
        TIME_ATTACK_DURATION: 60,
        // Screen shake settings
        SCREEN_SHAKE_INTENSITY: 8,
        SCREEN_SHAKE_DURATION: 300,
      };

      // ============================================
      // COLOR THEMES
      // ============================================
      const THEMES = {
        neon: {
          name: 'Neon Nights',
          background: '#0a0a1a',
          canvasBackground: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
          ballColors: ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b', '#fb5607'],
          textColor: '#ffffff',
          uiBackground: 'rgba(20, 20, 40, 0.9)',
          uiBorder: '#8338ec',
          buttonGradient: ['#8338ec', '#ff006e'],
          particleGlow: true,
          unlockLevel: 0 // Always available
        },
        sunset: {
          name: 'Sunset Vibes',
          background: '#1a0a1a',
          canvasBackground: 'linear-gradient(135deg, #2d1f3d 0%, #4a2040 50%, #6b2d5b 100%)',
          ballColors: ['#ff6b6b', '#ffd93d', '#ff8e3c', '#d63384', '#e85d04', '#ffb703'],
          textColor: '#ffffff',
          uiBackground: 'rgba(45, 31, 61, 0.9)',
          uiBorder: '#ff6b6b',
          buttonGradient: ['#ff6b6b', '#ffd93d'],
          particleGlow: true,
          unlockLevel: 0 // Always available
        },
        ocean: {
          name: 'Deep Ocean',
          background: '#001220',
          canvasBackground: 'linear-gradient(135deg, #001830 0%, #003060 50%, #004080 100%)',
          ballColors: ['#00b4d8', '#0077b6', '#48cae4', '#90e0ef', '#00f5d4', '#7209b7'],
          textColor: '#ffffff',
          uiBackground: 'rgba(0, 48, 96, 0.9)',
          uiBorder: '#00b4d8',
          buttonGradient: ['#0077b6', '#00b4d8'],
          particleGlow: true,
          unlockLevel: 5 // Unlock at level 5
        },
        forest: {
          name: 'Enchanted Forest',
          background: '#0a1a0a',
          canvasBackground: 'linear-gradient(135deg, #1a2f1a 0%, #2d4a2d 50%, #3d6b3d 100%)',
          ballColors: ['#80ed99', '#57cc99', '#38a3a5', '#22577a', '#c7f9cc', '#b5e48c'],
          textColor: '#ffffff',
          uiBackground: 'rgba(45, 74, 45, 0.9)',
          uiBorder: '#80ed99',
          buttonGradient: ['#57cc99', '#80ed99'],
          particleGlow: true,
          unlockLevel: 8 // Unlock at level 8
        },
        candy: {
          name: 'Candy Pop',
          background: '#fff0f5',
          canvasBackground: 'linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd0e8 100%)',
          ballColors: ['#ff69b4', '#dda0dd', '#98fb98', '#87ceeb', '#ffd700', '#ff6347'],
          textColor: '#333333',
          uiBackground: 'rgba(255, 224, 240, 0.95)',
          uiBorder: '#ff69b4',
          buttonGradient: ['#ff69b4', '#dda0dd'],
          particleGlow: false,
          unlockLevel: 12 // Unlock at level 12
        },
        midnight: {
          name: 'Midnight Galaxy',
          background: '#000011',
          canvasBackground: 'linear-gradient(135deg, #000022 0%, #110033 50%, #220044 100%)',
          ballColors: ['#9d4edd', '#c77dff', '#e0aaff', '#7b2cbf', '#5a189a', '#ff6d00'],
          textColor: '#e0aaff',
          uiBackground: 'rgba(17, 0, 51, 0.95)',
          uiBorder: '#9d4edd',
          buttonGradient: ['#7b2cbf', '#c77dff'],
          particleGlow: true,
          unlockLevel: 15 // Unlock at level 15
        }
      };

      // ============================================
      // GAME STATE
      // ============================================
      const state = {
        canvas: null,
        ctx: null,
        width: 0,
        height: 0,
        dpr: 1,

        // Game state
        gameState: 'menu', // menu, playing, paused, levelComplete, upgradeSelect, gameOver, settings, levelSelect, stats, modeSelect, tutorial
        gameMode: 'classic', // classic, timeAttack, zen, precision
        level: 1,
        score: 0,
        highScore: 0,
        combo: 0,
        maxCombo: 0,
        lastPopTime: 0,
        clicks: 0,

        // Level state
        balls: [],
        particles: [],
        ripples: [],
        floatingTexts: [],
        confetti: [],
        numballs: 0,
        target: 0,
        numPopped: 0,

        // Star rating for current level
        stars: 0,
        levelStars: {}, // Track stars per level

        // Streak system
        streak: 0,
        maxStreak: 0,

        // Player upgrades (persist across levels)
        upgrades: {
          bonusBalls: 0,        // Extra balls added each level
          radiusBonus: 0,       // Percentage bonus to explosion radius
          megaBallAvailable: false  // Has a mega ball ready to use
        },

        // Screen effects
        screenShake: { active: false, intensity: 0, duration: 0, startTime: 0 },
        slowMo: { active: false, factor: 1, duration: 0, startTime: 0 },

        // Time attack mode
        timeRemaining: 0,
        timeAttackScore: 0,

        // Statistics (persistent)
        stats: {
          totalPops: 0,
          bestCombo: 0,
          highestLevel: 0,
          gamesPlayed: 0,
          totalPlayTime: 0,
          totalScore: 0
        },

        // Unlocks
        unlocks: {
          highestLevelReached: 1
        },

        // Tutorial
        tutorialSeen: false,
        showTip: false,
        currentTip: '',

        // Animation
        lastTime: 0,
        deltaTime: 0,
        sessionStartTime: 0,

        // Settings
        settings: {
          theme: 'neon',
          soundEnabled: true,
          vibrationEnabled: true,
          particlesEnabled: true
        },

        // Audio
        audioContext: null,

        // Touch
        touchStartTime: 0
      };

      // ============================================
      // BALL CLASS
      // ============================================
      class Ball {
        constructor(x, y, isActive = false, options = {}) {
          this.x = x;
          this.y = y;
          this.vx = (Math.random() * 2 - 1) * CONFIG.BASE_SPEED;
          this.vy = (Math.random() * 2 - 1) * CONFIG.BASE_SPEED;
          this.radius = options.radius || CONFIG.BASE_RADIUS;
          this.maxRadius = options.maxRadius || CONFIG.MAX_RADIUS;
          this.color = options.color || this.getRandomColor();
          this.alpha = 1;
          this.isActive = isActive;
          this.isDead = false;
          this.isExpanding = true;
          this.colorPhase = Math.random() * Math.PI * 2;
          this.colorSpeed = 0.02 + Math.random() * 0.02;
          this.glowIntensity = 0;

          // Special ball types
          this.type = options.type || 'normal'; // normal, golden, bomb, frozen, speed
          this.speedMultiplier = options.speedMultiplier || 1;
          this.shrinkSpeed = options.shrinkSpeed || 1;
          this.isMegaBall = options.isMegaBall || false;
          this.pointMultiplier = 1;
          this.bombRadius = 0; // For bomb balls

          // Apply special type properties
          this.applySpecialType();
        }

        applySpecialType() {
          switch (this.type) {
            case 'golden':
              this.color = '#ffd700';
              this.pointMultiplier = 3;
              this.glowIntensity = 0.5;
              break;
            case 'bomb':
              this.color = '#ff4444';
              this.bombRadius = CONFIG.MAX_RADIUS * 0.6;
              break;
            case 'frozen':
              this.color = '#87ceeb';
              this.vx = 0;
              this.vy = 0;
              this.speedMultiplier = 0;
              this.pointMultiplier = 2;
              break;
            case 'speed':
              this.color = '#00ff88';
              this.speedMultiplier = 2;
              this.pointMultiplier = 1.5;
              break;
          }
        }

        getRandomColor() {
          const theme = THEMES[state.settings.theme];
          return theme.ballColors[Math.floor(Math.random() * theme.ballColors.length)];
        }

        update(dt, width, height) {
          if (this.isDead) return;

          // Apply slow-mo factor
          const slowFactor = state.slowMo.active ? state.slowMo.factor : 1;
          const speed = (dt * 60 / 1000) * slowFactor;

          if (!this.isActive) {
            // Frozen balls don't move
            if (this.type === 'frozen') return;

            // Bounce off walls
            if (this.x - this.radius < 0 || this.x + this.radius > width) {
              this.vx *= -1;
              this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
            }
            if (this.y - this.radius < 0 || this.y + this.radius > height) {
              this.vy *= -1;
              this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
            }

            this.x += this.vx * speed * this.speedMultiplier;
            this.y += this.vy * speed * this.speedMultiplier;

            // Color animation (pulsing for special types)
            this.colorPhase += this.colorSpeed * speed;
            if (this.type === 'golden' || this.type === 'bomb') {
              this.glowIntensity = 0.3 + Math.sin(this.colorPhase * 2) * 0.2;
            }
          } else {
            // Active ball expansion/contraction
            if (this.isExpanding) {
              this.radius += 2 * speed;
              this.glowIntensity = Math.min(1, this.glowIntensity + 0.1 * speed);
              if (this.radius >= this.maxRadius) {
                this.isExpanding = false;
              }
            } else {
              this.radius -= 1.5 * speed * this.shrinkSpeed;
              this.alpha -= 0.015 * speed * this.shrinkSpeed;
              this.glowIntensity -= 0.05 * speed;

              if (this.radius <= 0 || this.alpha <= 0) {
                this.isDead = true;
                this.isActive = false;
                this.radius = 0;
                this.alpha = 0;
              }
            }
          }
        }

        draw(ctx) {
          if (this.isDead || this.radius <= 0) return;

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);

          // Glow effect for active balls and special types
          const shouldGlow = this.isActive || this.type === 'golden' || this.type === 'bomb' || this.isMegaBall;
          if (shouldGlow && this.glowIntensity > 0) {
            ctx.shadowColor = this.isMegaBall ? '#ffd700' : this.color;
            ctx.shadowBlur = this.isMegaBall ? 40 * this.glowIntensity : 20 * this.glowIntensity;
          }

          // Gradient fill
          const gradient = ctx.createRadialGradient(
            this.x - this.radius * 0.3,
            this.y - this.radius * 0.3,
            0,
            this.x,
            this.y,
            this.radius
          );

          const baseColor = this.color;
          gradient.addColorStop(0, this.lightenColor(baseColor, 40));
          gradient.addColorStop(0.5, baseColor);
          gradient.addColorStop(1, this.darkenColor(baseColor, 30));

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // Special type indicators
          if (!this.isActive && this.type !== 'normal') {
            ctx.font = `${this.radius * 0.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            switch (this.type) {
              case 'golden': ctx.fillText('$', this.x, this.y); break;
              case 'bomb': ctx.fillText('💣', this.x, this.y); break;
              case 'frozen': ctx.fillText('❄', this.x, this.y); break;
              case 'speed': ctx.fillText('⚡', this.x, this.y); break;
            }
          }

          // Shine effect
          if (this.radius > 5 && this.type === 'normal') {
            ctx.beginPath();
            ctx.arc(
              this.x - this.radius * 0.25,
              this.y - this.radius * 0.25,
              this.radius * 0.2,
              0,
              Math.PI * 2
            );
            ctx.fillStyle = `rgba(255, 255, 255, ${0.4 * this.alpha})`;
            ctx.fill();
          }

          ctx.restore();
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.min(255, (num >> 16) + amt);
          const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
          const B = Math.min(255, (num & 0x0000FF) + amt);
          return `rgb(${R}, ${G}, ${B})`;
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, (num >> 16) - amt);
          const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
          const B = Math.max(0, (num & 0x0000FF) - amt);
          return `rgb(${R}, ${G}, ${B})`;
        }

        collidesWith(other) {
          const dx = this.x - other.x;
          const dy = this.y - other.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          return distance < this.radius + other.radius;
        }
      }

      // ============================================
      // PARTICLE CLASS
      // ============================================
      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.radius = Math.random() * 4 + 2;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 4;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.alpha = 1;
          this.decay = 0.02 + Math.random() * 0.02;
          this.gravity = 0.15;
        }

        update(dt) {
          const speed = dt * 60 / 1000;
          this.x += this.vx * speed;
          this.y += this.vy * speed;
          this.vy += this.gravity * speed;
          this.alpha -= this.decay * speed;
          this.radius *= 0.98;
          return this.alpha > 0 && this.radius > 0.5;
        }

        draw(ctx) {
          const theme = THEMES[state.settings.theme];
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);

          if (theme.particleGlow) {
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
          }

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.restore();
        }
      }

      // ============================================
      // RIPPLE CLASS
      // ============================================
      class Ripple {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 0;
          this.maxRadius = 60;
          this.alpha = 0.5;
          this.speed = 3;
        }

        update(dt) {
          const speed = dt * 60 / 1000;
          this.radius += this.speed * speed;
          this.alpha -= 0.02 * speed;
          return this.alpha > 0 && this.radius < this.maxRadius;
        }

        draw(ctx) {
          const theme = THEMES[state.settings.theme];
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.strokeStyle = theme.ballColors[0];
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // ============================================
      // FLOATING TEXT CLASS (Score popups)
      // ============================================
      class FloatingText {
        constructor(x, y, text, options = {}) {
          this.x = x;
          this.y = y;
          this.text = text;
          this.color = options.color || '#ffffff';
          this.fontSize = options.fontSize || 20;
          this.alpha = 1;
          this.vy = -2;
          this.lifetime = options.lifetime || 1000;
          this.startTime = Date.now();
          this.scale = options.scale || 1;
          this.isCombo = options.isCombo || false;
        }

        update(dt) {
          const speed = dt * 60 / 1000;
          this.y += this.vy * speed;
          const elapsed = Date.now() - this.startTime;
          this.alpha = Math.max(0, 1 - elapsed / this.lifetime);
          if (this.isCombo) {
            this.scale = 1 + Math.sin(elapsed * 0.01) * 0.1;
          }
          return this.alpha > 0;
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.font = `bold ${this.fontSize * this.scale}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Shadow for visibility
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;

          ctx.fillStyle = this.color;
          ctx.fillText(this.text, this.x, this.y);
          ctx.restore();
        }
      }

      // ============================================
      // CONFETTI CLASS (Level complete celebration)
      // ============================================
      class Confetti {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          this.width = Math.random() * 10 + 5;
          this.height = Math.random() * 6 + 3;
          this.vx = (Math.random() - 0.5) * 10;
          this.vy = Math.random() * -8 - 4;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.3;
          this.gravity = 0.2;
          this.alpha = 1;
        }

        update(dt) {
          const speed = dt * 60 / 1000;
          this.x += this.vx * speed;
          this.y += this.vy * speed;
          this.vy += this.gravity * speed;
          this.rotation += this.rotationSpeed * speed;

          // Fade out when below screen
          if (this.y > state.height) {
            this.alpha -= 0.05 * speed;
          }

          return this.alpha > 0;
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
          ctx.restore();
        }
      }

      // ============================================
      // TIPS SYSTEM
      // ============================================
      const TIPS = [
        "Tap once to start a chain reaction!",
        "Golden balls ($) are worth 3x points!",
        "Bomb balls (💣) create secondary explosions!",
        "Frozen balls (❄) don't move - easy targets!",
        "Speed balls (⚡) give bonus points!",
        "Build combos for higher scores!",
        "Try to pop more balls for more stars!",
        "Upgrade wisely between levels!",
        "Mega balls have 2x the explosion radius!",
        "Keep your streak going for bonus multipliers!"
      ];

      // ============================================
      // AUDIO SYSTEM
      // ============================================
      const Audio = {
        init() {
          try {
            state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.log('Web Audio not supported');
          }
        },

        resume() {
          if (state.audioContext && state.audioContext.state === 'suspended') {
            state.audioContext.resume();
          }
        },

        playPop(pitch = 1) {
          if (!state.settings.soundEnabled || !state.audioContext) return;

          try {
            const osc = state.audioContext.createOscillator();
            const gain = state.audioContext.createGain();

            osc.connect(gain);
            gain.connect(state.audioContext.destination);

            osc.frequency.setValueAtTime(400 * pitch, state.audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200 * pitch, state.audioContext.currentTime + 0.1);

            gain.gain.setValueAtTime(0.3, state.audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.15);

            osc.start(state.audioContext.currentTime);
            osc.stop(state.audioContext.currentTime + 0.15);
          } catch (e) {
            // Ignore audio errors
          }
        },

        playCombo(comboLevel) {
          if (!state.settings.soundEnabled || !state.audioContext) return;

          try {
            const baseFreq = 300 + comboLevel * 50;
            const osc = state.audioContext.createOscillator();
            const gain = state.audioContext.createGain();

            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(state.audioContext.destination);

            osc.frequency.setValueAtTime(baseFreq, state.audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, state.audioContext.currentTime + 0.1);

            gain.gain.setValueAtTime(0.2, state.audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.2);

            osc.start(state.audioContext.currentTime);
            osc.stop(state.audioContext.currentTime + 0.2);
          } catch (e) {
            // Ignore audio errors
          }
        },

        playLevelUp() {
          if (!state.settings.soundEnabled || !state.audioContext) return;

          try {
            const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
              setTimeout(() => {
                const osc = state.audioContext.createOscillator();
                const gain = state.audioContext.createGain();

                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(state.audioContext.destination);

                osc.frequency.setValueAtTime(freq, state.audioContext.currentTime);
                gain.gain.setValueAtTime(0.2, state.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.3);

                osc.start(state.audioContext.currentTime);
                osc.stop(state.audioContext.currentTime + 0.3);
              }, i * 100);
            });
          } catch (e) {
            // Ignore audio errors
          }
        },

        playGameOver() {
          if (!state.settings.soundEnabled || !state.audioContext) return;

          try {
            const notes = [400, 350, 300, 250];
            notes.forEach((freq, i) => {
              setTimeout(() => {
                const osc = state.audioContext.createOscillator();
                const gain = state.audioContext.createGain();

                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(state.audioContext.destination);

                osc.frequency.setValueAtTime(freq, state.audioContext.currentTime);
                gain.gain.setValueAtTime(0.2, state.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.4);

                osc.start(state.audioContext.currentTime);
                osc.stop(state.audioContext.currentTime + 0.4);
              }, i * 150);
            });
          } catch (e) {
            // Ignore audio errors
          }
        }
      };

      // ============================================
      // HAPTIC FEEDBACK
      // ============================================
      const Haptic = {
        vibrate(pattern) {
          if (!state.settings.vibrationEnabled) return;
          if (navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        },

        pop() {
          this.vibrate(20);
        },

        combo() {
          this.vibrate([20, 30, 20]);
        },

        levelUp() {
          this.vibrate([50, 50, 50, 50, 100]);
        },

        gameOver() {
          this.vibrate([100, 50, 100]);
        }
      };

      // ============================================
      // STORAGE
      // ============================================
      const Storage = {
        saveHighScore(score) {
          try {
            localStorage.setItem(CONFIG.HIGH_SCORE_KEY, score.toString());
          } catch (e) {
            // Storage not available
          }
        },

        loadHighScore() {
          try {
            return parseInt(localStorage.getItem(CONFIG.HIGH_SCORE_KEY)) || 0;
          } catch (e) {
            return 0;
          }
        },

        saveSettings(settings) {
          try {
            localStorage.setItem(CONFIG.SETTINGS_KEY, JSON.stringify(settings));
          } catch (e) {
            // Storage not available
          }
        },

        loadSettings() {
          try {
            const saved = localStorage.getItem(CONFIG.SETTINGS_KEY);
            return saved ? JSON.parse(saved) : null;
          } catch (e) {
            return null;
          }
        },

        saveStats(stats) {
          try {
            localStorage.setItem(CONFIG.STATS_KEY, JSON.stringify(stats));
          } catch (e) {
            // Storage not available
          }
        },

        loadStats() {
          try {
            const saved = localStorage.getItem(CONFIG.STATS_KEY);
            return saved ? JSON.parse(saved) : null;
          } catch (e) {
            return null;
          }
        },

        saveUnlocks(unlocks) {
          try {
            localStorage.setItem(CONFIG.UNLOCKS_KEY, JSON.stringify(unlocks));
          } catch (e) {
            // Storage not available
          }
        },

        loadUnlocks() {
          try {
            const saved = localStorage.getItem(CONFIG.UNLOCKS_KEY);
            return saved ? JSON.parse(saved) : null;
          } catch (e) {
            return null;
          }
        },

        saveTutorialSeen() {
          try {
            localStorage.setItem('popemall_tutorial', 'true');
          } catch (e) {}
        },

        loadTutorialSeen() {
          try {
            return localStorage.getItem('popemall_tutorial') === 'true';
          } catch (e) {
            return false;
          }
        }
      };

      // ============================================
      // LEVEL SYSTEM
      // ============================================
      const LevelSystem = {
        calculateBallCount(level) {
          // Base count + bonus from upgrades
          const baseCount = CONFIG.BASE_BALL_COUNT + Math.floor((level - 1) / 5) * CONFIG.BALLS_PER_TIER;
          const withBonus = baseCount + state.upgrades.bonusBalls;
          return Math.min(CONFIG.MAX_BALLS, withBonus);
        },

        calculateTarget(level, ballCount) {
          // Slower progression: 1, 2, 3, 4, 5... instead of 2, 4, 6...
          // Target is simply the level number, capped at a reasonable percentage of balls
          const target = Math.min(level, Math.floor(ballCount * 0.8));
          return Math.max(1, target);
        },

        getPlayerMaxRadius() {
          // Base radius with percentage bonus from upgrades, minus penalty from extra balls
          const radiusPenalty = state.upgrades.bonusBalls * 0.03; // 3% penalty per bonus ball
          const effectiveBonus = state.upgrades.radiusBonus - radiusPenalty;
          return Math.max(40, CONFIG.MAX_RADIUS * (1 + effectiveBonus));
        },

        getMegaBallRadius() {
          // Mega ball has 2x the player's current max radius
          return this.getPlayerMaxRadius() * 2;
        },

        getBallOptions(level) {
          const options = { type: 'normal', speedMultiplier: 1, shrinkSpeed: 1 };

          // Speed increases every 10 levels (slower progression)
          options.speedMultiplier = 1 + Math.floor(level / 10) * 0.1;

          // Smaller max radius at higher levels (slower progression)
          if (level > 15) {
            options.maxRadius = CONFIG.MAX_RADIUS - Math.min(25, (level - 15) * 1.5);
          }

          // Faster shrink at higher levels (slower progression)
          if (level > 20) {
            options.shrinkSpeed = 1 + (level - 20) * 0.03;
          }

          return options;
        },

        getSpecialBallChance(level) {
          if (level < 5) return 0;
          return Math.min(0.25, (level - 5) * 0.025);
        },

        getRandomSpecialType() {
          const types = CONFIG.SPECIAL_BALL_TYPES;
          return types[Math.floor(Math.random() * types.length)];
        },

        calculateStars(popped, total) {
          const ratio = popped / total;
          if (ratio >= CONFIG.STAR_THRESHOLDS.three) return 3;
          if (ratio >= CONFIG.STAR_THRESHOLDS.two) return 2;
          return 1;
        },

        getStreakBonus(streak) {
          // Streak multiplier: 1x, 1.1x, 1.2x, 1.3x, etc.
          return 1 + Math.min(streak * 0.1, 0.5); // Max 50% bonus
        },

        isThemeUnlocked(themeKey) {
          const theme = THEMES[themeKey];
          return state.unlocks.highestLevelReached >= theme.unlockLevel;
        }
      };

      // ============================================
      // UI RENDERING
      // ============================================
      const UI = {
        drawBackground(ctx) {
          const theme = THEMES[state.settings.theme];

          // Create gradient background
          const gradient = ctx.createLinearGradient(0, 0, state.width, state.height);
          const bgColors = theme.canvasBackground.match(/#[a-f0-9]{6}/gi);
          if (bgColors) {
            gradient.addColorStop(0, bgColors[0]);
            gradient.addColorStop(0.5, bgColors[1] || bgColors[0]);
            gradient.addColorStop(1, bgColors[2] || bgColors[0]);
          }

          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, state.width, state.height);

          // Add subtle grid pattern for depth
          ctx.strokeStyle = `rgba(255, 255, 255, 0.03)`;
          ctx.lineWidth = 1;
          const gridSize = 40;
          for (let x = 0; x < state.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, state.height);
            ctx.stroke();
          }
          for (let y = 0; y < state.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(state.width, y);
            ctx.stroke();
          }
        },

        drawHUD(ctx) {
          const theme = THEMES[state.settings.theme];
          const padding = 20;
          const fontSize = Math.min(24, state.height * 0.04);

          ctx.save();
          ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
          ctx.textBaseline = 'top';

          // Level & Target (top left) - different for different modes
          ctx.fillStyle = theme.textColor;
          ctx.textAlign = 'left';

          if (state.gameMode === 'timeAttack') {
            ctx.fillText('TIME ATTACK', padding, padding);
            const timeLeft = Math.ceil(state.timeRemaining);
            ctx.font = `${fontSize * 0.7}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = timeLeft < 10 ? '#ff4444' : theme.textColor;
            ctx.fillText(`Time: ${timeLeft}s`, padding, padding + fontSize + 5);
          } else if (state.gameMode === 'zen') {
            ctx.fillText('ZEN MODE', padding, padding);
            ctx.font = `${fontSize * 0.7}px 'Segoe UI', sans-serif`;
            ctx.fillText('Relax and enjoy', padding, padding + fontSize + 5);
          } else if (state.gameMode === 'precision') {
            ctx.fillText(`Level ${state.level}`, padding, padding);
            ctx.font = `${fontSize * 0.7}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = state.numPopped === state.target ? '#80ed99' : theme.textColor;
            ctx.fillText(`Pop EXACTLY ${state.target}`, padding, padding + fontSize + 5);
          } else {
            ctx.fillText(`Level ${state.level}`, padding, padding);
            ctx.font = `${fontSize * 0.7}px 'Segoe UI', sans-serif`;
            ctx.fillText(`Pop ${state.target} balls`, padding, padding + fontSize + 5);
          }

          // Streak indicator (below target)
          if (state.streak > 0 && state.gameMode === 'classic') {
            ctx.font = `${fontSize * 0.6}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#ffd700';
            ctx.fillText(`🔥 Streak: ${state.streak}`, padding, padding + fontSize * 2 + 10);
          }

          // Score (top center)
          ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillStyle = theme.textColor;
          ctx.fillText(`Score: ${state.score}`, state.width / 2, padding);

          // High score / streak bonus
          ctx.font = `${fontSize * 0.6}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.6)`;
          ctx.fillText(`Best: ${state.highScore}`, state.width / 2, padding + fontSize + 5);

          // Progress (top right)
          ctx.textAlign = 'right';
          ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          if (state.gameMode !== 'zen') {
            ctx.fillText(`${state.numPopped} / ${state.target}`, state.width - padding, padding);
          } else {
            ctx.fillText(`Popped: ${state.numPopped}`, state.width - padding, padding);
          }

          // Mega ball indicator (bottom center)
          if (state.upgrades.megaBallAvailable) {
            ctx.textAlign = 'center';
            ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;

            // Glowing effect
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffd700';
            ctx.fillText('⭐ MEGA BALL READY! ⭐', state.width / 2, state.height - padding - fontSize);
            ctx.shadowBlur = 0;
          }

          // Combo display
          if (state.combo > 1) {
            const comboSize = fontSize * 1.5;
            ctx.font = `bold ${comboSize}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillStyle = theme.ballColors[state.combo % theme.ballColors.length];

            if (THEMES[state.settings.theme].particleGlow) {
              ctx.shadowColor = theme.ballColors[state.combo % theme.ballColors.length];
              ctx.shadowBlur = 20;
            }

            ctx.fillText(`${state.combo}x COMBO!`, state.width / 2, state.height / 2 - comboSize);
          }

          ctx.restore();
        },

        drawMenu(ctx) {
          const theme = THEMES[state.settings.theme];

          this.drawBackground(ctx);

          ctx.save();

          // Title
          const titleSize = Math.min(60, state.height * 0.12);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title glow
          if (theme.particleGlow) {
            ctx.shadowColor = theme.ballColors[0];
            ctx.shadowBlur = 30;
          }

          ctx.fillStyle = theme.textColor;
          ctx.fillText("Pop'em All!", state.width / 2, state.height * 0.15);

          ctx.shadowBlur = 0;

          // High score and streak
          const subtitleSize = titleSize * 0.35;
          ctx.font = `${subtitleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.7)`;
          ctx.fillText(`High Score: ${state.highScore}`, state.width / 2, state.height * 0.22);
          if (state.maxStreak > 0) {
            ctx.fillText(`Best Streak: ${state.maxStreak}`, state.width / 2, state.height * 0.27);
          }

          // Buttons - 2 columns for more options
          const btnY = state.height * 0.38;
          const btnSpacing = state.height * 0.12;
          this.drawButton(ctx, state.width / 2, btnY, 'Play', 'play');
          this.drawButton(ctx, state.width / 2, btnY + btnSpacing, 'Game Modes', 'modeSelect');
          this.drawButton(ctx, state.width / 2, btnY + btnSpacing * 2, 'Level Select', 'levelSelect');
          this.drawButton(ctx, state.width / 2, btnY + btnSpacing * 3, 'Statistics', 'stats');
          this.drawButton(ctx, state.width / 2, btnY + btnSpacing * 4, 'Settings', 'settings');

          // Theme indicator
          ctx.font = `${subtitleSize * 0.8}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.5)`;
          ctx.fillText(`Theme: ${theme.name}`, state.width / 2, state.height * 0.95);

          ctx.restore();
        },

        drawButton(ctx, x, y, text, id) {
          const theme = THEMES[state.settings.theme];
          const btnWidth = Math.min(250, state.width * 0.4);
          const btnHeight = Math.min(50, state.height * 0.08);
          const btnX = x - btnWidth / 2;
          const btnY = y - btnHeight / 2;

          // Store button bounds for click detection
          if (!state.buttons) state.buttons = {};
          state.buttons[id] = { x: btnX, y: btnY, width: btnWidth, height: btnHeight };

          // Button background
          const gradient = ctx.createLinearGradient(btnX, btnY, btnX + btnWidth, btnY + btnHeight);
          gradient.addColorStop(0, theme.buttonGradient[0]);
          gradient.addColorStop(1, theme.buttonGradient[1]);

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.roundRect(btnX, btnY, btnWidth, btnHeight, 10);
          ctx.fill();

          // Button border
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Button text
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${btnHeight * 0.4}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, x, y);
        },

        drawPauseMenu(ctx) {
          // Dim background
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(0, 0, state.width, state.height);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Paused title
          const titleSize = Math.min(50, state.height * 0.1);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('PAUSED', state.width / 2, state.height * 0.25);

          // Current stats
          const statsSize = titleSize * 0.4;
          ctx.font = `${statsSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(255, 255, 255, 0.7)`;
          ctx.fillText(`Level: ${state.level}  |  Score: ${state.score}`, state.width / 2, state.height * 0.35);

          // Buttons
          this.drawButton(ctx, state.width / 2, state.height * 0.5, 'Resume', 'resume');
          this.drawButton(ctx, state.width / 2, state.height * 0.63, 'Restart', 'restart');
          this.drawButton(ctx, state.width / 2, state.height * 0.76, 'Main Menu', 'mainMenu');

          ctx.restore();
        },

        drawLevelComplete(ctx) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(0, 0, state.width, state.height);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Success message
          const titleSize = Math.min(50, state.height * 0.1);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;

          if (theme.particleGlow) {
            ctx.shadowColor = theme.ballColors[0];
            ctx.shadowBlur = 20;
          }

          ctx.fillStyle = theme.ballColors[0];
          ctx.fillText('LEVEL COMPLETE!', state.width / 2, state.height * 0.12);

          ctx.shadowBlur = 0;

          // Star rating
          const starSize = titleSize * 0.8;
          ctx.font = `${starSize}px sans-serif`;
          let starDisplay = '';
          for (let i = 0; i < 3; i++) {
            starDisplay += i < state.stars ? '⭐' : '☆';
          }
          ctx.fillText(starDisplay, state.width / 2, state.height * 0.22);

          // Stats
          const statsSize = titleSize * 0.4;
          ctx.font = `${statsSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText(`Popped: ${state.numPopped} / ${state.numballs}`, state.width / 2, state.height * 0.32);

          const streakBonus = LevelSystem.getStreakBonus(state.streak);
          const bonusText = streakBonus > 1 ? ` (${Math.round((streakBonus - 1) * 100)}% streak bonus!)` : '';
          ctx.fillText(`Score: +${state.levelScore || 0}${bonusText}`, state.width / 2, state.height * 0.38);

          if (state.maxCombo > 1) {
            ctx.fillText(`Max Combo: ${state.maxCombo}x`, state.width / 2, state.height * 0.44);
          }

          // Streak display
          if (state.streak > 0) {
            ctx.fillStyle = '#ffd700';
            ctx.fillText(`🔥 Level Streak: ${state.streak}`, state.width / 2, state.height * 0.50);
          }

          // Tip
          if (state.showTip && state.currentTip) {
            ctx.font = `italic ${statsSize * 0.8}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.7)`;
            ctx.fillText(`💡 ${state.currentTip}`, state.width / 2, state.height * 0.57);
          }

          // Button to go to upgrade selection
          this.drawButton(ctx, state.width / 2, state.height * 0.68, 'Choose Upgrade', 'chooseUpgrade');

          // Skip upgrade option
          ctx.font = `${statsSize * 0.7}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.6)`;
          ctx.fillText('or', state.width / 2, state.height * 0.78);

          this.drawButton(ctx, state.width / 2, state.height * 0.86, 'Skip to Next Level', 'skipUpgrade');

          ctx.restore();
        },

        drawUpgradeSelect(ctx) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.fillRect(0, 0, state.width, state.height);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Choose Your Upgrade', state.width / 2, state.height * 0.1);

          // Current stats display
          const statsSize = titleSize * 0.4;
          ctx.font = `${statsSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.7)`;
          const currentRadius = Math.round(LevelSystem.getPlayerMaxRadius());
          const currentBalls = LevelSystem.calculateBallCount(state.level + 1);
          ctx.fillText(`Current: ${currentBalls} balls, ${currentRadius}px explosion radius`, state.width / 2, state.height * 0.17);

          // Three upgrade cards
          const cardWidth = Math.min(200, state.width * 0.25);
          const cardHeight = Math.min(280, state.height * 0.55);
          const cardSpacing = Math.min(40, state.width * 0.05);
          const totalWidth = cardWidth * 3 + cardSpacing * 2;
          const startX = (state.width - totalWidth) / 2;
          const cardY = state.height * 0.25;

          // Card 1: More Balls
          this.drawUpgradeCard(ctx, startX, cardY, cardWidth, cardHeight, {
            id: 'upgrade_balls',
            title: 'More Balls',
            icon: '🎱',
            description: '+3 balls per level',
            penalty: '-10% explosion radius',
            color: theme.ballColors[0],
            isAvailable: true
          });

          // Card 2: Bigger Radius
          this.drawUpgradeCard(ctx, startX + cardWidth + cardSpacing, cardY, cardWidth, cardHeight, {
            id: 'upgrade_radius',
            title: 'Bigger Boom',
            icon: '💥',
            description: '+15% explosion radius',
            penalty: 'No penalty',
            color: theme.ballColors[2],
            isAvailable: true
          });

          // Card 3: Mega Ball
          this.drawUpgradeCard(ctx, startX + (cardWidth + cardSpacing) * 2, cardY, cardWidth, cardHeight, {
            id: 'upgrade_mega',
            title: 'Mega Ball',
            icon: '⭐',
            description: 'One-time use',
            penalty: '2x explosion radius, glowing!',
            color: '#ffd700',
            isAvailable: !state.upgrades.megaBallAvailable,
            isMega: true
          });

          ctx.restore();
        },

        drawUpgradeCard(ctx, x, y, width, height, options) {
          const theme = THEMES[state.settings.theme];

          // Store button bounds
          if (!state.buttons) state.buttons = {};
          state.buttons[options.id] = { x, y, width, height };

          // Card background
          ctx.fillStyle = options.isAvailable ? theme.uiBackground : 'rgba(50, 50, 50, 0.8)';
          ctx.beginPath();
          ctx.roundRect(x, y, width, height, 15);
          ctx.fill();

          // Card border
          ctx.strokeStyle = options.isAvailable ? options.color : 'rgba(100, 100, 100, 0.5)';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Glow effect for mega ball
          if (options.isMega && options.isAvailable) {
            ctx.save();
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          const centerX = x + width / 2;
          const padding = 15;

          // Icon
          ctx.font = `${Math.min(50, height * 0.18)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(options.icon, centerX, y + height * 0.18);

          // Title
          ctx.font = `bold ${Math.min(20, height * 0.08)}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = options.isAvailable ? options.color : 'rgba(150, 150, 150, 0.8)';
          ctx.fillText(options.title, centerX, y + height * 0.35);

          // Description
          ctx.font = `${Math.min(14, height * 0.05)}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = options.isAvailable ? theme.textColor : 'rgba(150, 150, 150, 0.8)';
          ctx.fillText(options.description, centerX, y + height * 0.50);

          // Penalty/bonus
          ctx.font = `${Math.min(12, height * 0.045)}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = options.penalty.includes('-') ? '#ff6b6b' : '#80ed99';
          ctx.fillText(options.penalty, centerX, y + height * 0.62);

          // Already owned indicator for mega ball
          if (options.isMega && !options.isAvailable) {
            ctx.font = `bold ${Math.min(14, height * 0.05)}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#ffd700';
            ctx.fillText('(Already owned!)', centerX, y + height * 0.75);
          }

          // Select text at bottom
          if (options.isAvailable) {
            ctx.font = `bold ${Math.min(16, height * 0.06)}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = theme.textColor;
            ctx.fillText('TAP TO SELECT', centerX, y + height * 0.88);
          }
        },

        drawGameOver(ctx) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
          ctx.fillRect(0, 0, state.width, state.height);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Game over message
          const titleSize = Math.min(50, state.height * 0.1);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = '#ff6b6b';
          ctx.fillText('GAME OVER', state.width / 2, state.height * 0.2);

          // Stats
          const statsSize = titleSize * 0.5;
          ctx.font = `${statsSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText(`Reached Level: ${state.level}`, state.width / 2, state.height * 0.33);
          ctx.fillText(`Final Score: ${state.score}`, state.width / 2, state.height * 0.41);

          if (state.score >= state.highScore && state.score > 0) {
            ctx.fillStyle = theme.ballColors[0];
            ctx.fillText('NEW HIGH SCORE!', state.width / 2, state.height * 0.49);
          }

          // Buttons
          this.drawButton(ctx, state.width / 2, state.height * 0.65, 'Try Again', 'restart');
          this.drawButton(ctx, state.width / 2, state.height * 0.78, 'Main Menu', 'mainMenu');

          ctx.restore();
        },

        drawSettings(ctx) {
          this.drawBackground(ctx);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Settings', state.width / 2, state.height * 0.12);

          // Settings options
          const optionSize = titleSize * 0.5;
          const startY = state.height * 0.25;
          const spacing = state.height * 0.12;

          // Sound toggle
          this.drawToggle(ctx, state.width / 2, startY, 'Sound', state.settings.soundEnabled, 'sound');

          // Vibration toggle
          this.drawToggle(ctx, state.width / 2, startY + spacing, 'Vibration', state.settings.vibrationEnabled, 'vibration');

          // Particles toggle
          this.drawToggle(ctx, state.width / 2, startY + spacing * 2, 'Particles', state.settings.particlesEnabled, 'particles');

          // Theme selector
          ctx.font = `${optionSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Theme:', state.width / 2, startY + spacing * 3);

          // Theme buttons
          const themeKeys = Object.keys(THEMES);
          const themeWidth = Math.min(100, state.width / (themeKeys.length + 1));
          const themeStartX = (state.width - themeWidth * themeKeys.length) / 2 + themeWidth / 2;

          themeKeys.forEach((key, i) => {
            const x = themeStartX + i * themeWidth;
            const y = startY + spacing * 3.6;
            const isActive = state.settings.theme === key;
            const isUnlocked = LevelSystem.isThemeUnlocked(key);

            if (!state.buttons) state.buttons = {};
            state.buttons[`theme_${key}`] = {
              x: x - themeWidth / 2 + 5,
              y: y - 20,
              width: themeWidth - 10,
              height: 40
            };

            if (isUnlocked) {
              ctx.fillStyle = isActive ? THEMES[key].buttonGradient[0] : THEMES[key].uiBackground;
            } else {
              ctx.fillStyle = 'rgba(60, 60, 60, 0.8)';
            }
            ctx.beginPath();
            ctx.roundRect(x - themeWidth / 2 + 5, y - 20, themeWidth - 10, 40, 8);
            ctx.fill();

            if (isActive && isUnlocked) {
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.stroke();
            }

            if (isUnlocked) {
              ctx.fillStyle = THEMES[key].textColor;
              ctx.font = `${optionSize * 0.6}px 'Segoe UI', sans-serif`;
              ctx.fillText(THEMES[key].name.split(' ')[0], x, y);
            } else {
              ctx.fillStyle = '#888';
              ctx.font = `${optionSize * 0.5}px 'Segoe UI', sans-serif`;
              ctx.fillText(`🔒 Lv ${THEMES[key].unlockLevel}`, x, y);
            }
          });

          // Back button
          this.drawButton(ctx, state.width / 2, state.height * 0.88, 'Back', 'back');

          ctx.restore();
        },

        drawToggle(ctx, x, y, label, isOn, id) {
          const theme = THEMES[state.settings.theme];
          const toggleWidth = 60;
          const toggleHeight = 30;
          const labelSize = Math.min(20, state.height * 0.04);

          if (!state.buttons) state.buttons = {};
          state.buttons[id] = {
            x: x + 20,
            y: y - toggleHeight / 2,
            width: toggleWidth,
            height: toggleHeight
          };

          // Label
          ctx.font = `${labelSize}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'right';
          ctx.fillStyle = theme.textColor;
          ctx.fillText(label, x - 10, y);

          // Toggle background
          ctx.fillStyle = isOn ? theme.buttonGradient[0] : 'rgba(128, 128, 128, 0.5)';
          ctx.beginPath();
          ctx.roundRect(x + 20, y - toggleHeight / 2, toggleWidth, toggleHeight, toggleHeight / 2);
          ctx.fill();

          // Toggle knob
          const knobX = isOn ? x + 20 + toggleWidth - toggleHeight / 2 - 3 : x + 20 + toggleHeight / 2 + 3;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(knobX, y, toggleHeight / 2 - 4, 0, Math.PI * 2);
          ctx.fill();
        },

        drawLevelSelect(ctx) {
          this.drawBackground(ctx);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Select Level', state.width / 2, state.height * 0.1);

          // Level grid
          const cols = 5;
          const rows = 4;
          const buttonSize = Math.min(60, state.width / (cols + 2), state.height / (rows + 3));
          const gridWidth = cols * (buttonSize + 15) - 15;
          const gridHeight = rows * (buttonSize + 15) - 15;
          const startX = (state.width - gridWidth) / 2;
          const startY = state.height * 0.22;

          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const level = row * cols + col + 1;
              const x = startX + col * (buttonSize + 15);
              const y = startY + row * (buttonSize + 15);

              if (!state.buttons) state.buttons = {};
              state.buttons[`level_${level}`] = { x, y, width: buttonSize, height: buttonSize };

              // Button background
              const gradient = ctx.createLinearGradient(x, y, x + buttonSize, y + buttonSize);
              gradient.addColorStop(0, theme.buttonGradient[0]);
              gradient.addColorStop(1, theme.buttonGradient[1]);

              ctx.fillStyle = gradient;
              ctx.beginPath();
              ctx.roundRect(x, y, buttonSize, buttonSize, 8);
              ctx.fill();

              // Level number
              ctx.fillStyle = '#ffffff';
              ctx.font = `bold ${buttonSize * 0.35}px 'Segoe UI', sans-serif`;
              ctx.fillText(level.toString(), x + buttonSize / 2, y + buttonSize * 0.4);

              // Stars for completed levels
              const stars = state.levelStars[level] || 0;
              if (stars > 0) {
                ctx.font = `${buttonSize * 0.2}px sans-serif`;
                let starStr = '';
                for (let i = 0; i < 3; i++) {
                  starStr += i < stars ? '⭐' : '☆';
                }
                ctx.fillText(starStr, x + buttonSize / 2, y + buttonSize * 0.7);
              }
            }
          }

          // Back button
          this.drawButton(ctx, state.width / 2, state.height * 0.88, 'Back', 'back');

          ctx.restore();
        },

        drawModeSelect(ctx) {
          this.drawBackground(ctx);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Game Modes', state.width / 2, state.height * 0.1);

          // Mode cards
          const cardWidth = Math.min(180, state.width * 0.22);
          const cardHeight = Math.min(180, state.height * 0.45);
          const cardSpacing = Math.min(30, state.width * 0.03);
          const modes = [
            { id: 'mode_classic', name: 'Classic', icon: '🎮', desc: 'Complete levels\nwith targets' },
            { id: 'mode_timeAttack', name: 'Time Attack', icon: '⏱️', desc: '60 seconds\nto score big!' },
            { id: 'mode_zen', name: 'Zen', icon: '🧘', desc: 'No targets\njust relax' },
            { id: 'mode_precision', name: 'Precision', icon: '🎯', desc: 'Pop EXACTLY\nthe target' }
          ];

          const totalWidth = cardWidth * modes.length + cardSpacing * (modes.length - 1);
          const startX = (state.width - totalWidth) / 2;
          const cardY = state.height * 0.25;

          modes.forEach((mode, i) => {
            const x = startX + i * (cardWidth + cardSpacing);

            if (!state.buttons) state.buttons = {};
            state.buttons[mode.id] = { x, y: cardY, width: cardWidth, height: cardHeight };

            // Card background
            ctx.fillStyle = theme.uiBackground;
            ctx.beginPath();
            ctx.roundRect(x, cardY, cardWidth, cardHeight, 12);
            ctx.fill();

            ctx.strokeStyle = theme.uiBorder;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Icon
            ctx.font = `${cardHeight * 0.2}px sans-serif`;
            ctx.fillText(mode.icon, x + cardWidth / 2, cardY + cardHeight * 0.2);

            // Name
            ctx.font = `bold ${cardHeight * 0.1}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = theme.textColor;
            ctx.fillText(mode.name, x + cardWidth / 2, cardY + cardHeight * 0.4);

            // Description
            ctx.font = `${cardHeight * 0.08}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.7)`;
            const lines = mode.desc.split('\n');
            lines.forEach((line, li) => {
              ctx.fillText(line, x + cardWidth / 2, cardY + cardHeight * 0.55 + li * cardHeight * 0.1);
            });

            // Play button
            ctx.font = `bold ${cardHeight * 0.08}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = theme.ballColors[0];
            ctx.fillText('TAP TO PLAY', x + cardWidth / 2, cardY + cardHeight * 0.85);
          });

          // Back button
          this.drawButton(ctx, state.width / 2, state.height * 0.88, 'Back', 'back');

          ctx.restore();
        },

        drawStats(ctx) {
          this.drawBackground(ctx);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('Statistics', state.width / 2, state.height * 0.1);

          // Stats display
          const statSize = titleSize * 0.5;
          const startY = state.height * 0.22;
          const spacing = state.height * 0.1;

          const stats = [
            { label: 'Total Pops', value: state.stats.totalPops.toLocaleString(), icon: '💥' },
            { label: 'Best Combo', value: `${state.stats.bestCombo}x`, icon: '🔥' },
            { label: 'Highest Level', value: state.stats.highestLevel, icon: '🏆' },
            { label: 'Games Played', value: state.stats.gamesPlayed, icon: '🎮' },
            { label: 'Total Score', value: state.stats.totalScore.toLocaleString(), icon: '⭐' },
            { label: 'Play Time', value: this.formatTime(state.stats.totalPlayTime), icon: '⏱️' }
          ];

          stats.forEach((stat, i) => {
            const y = startY + i * spacing;

            ctx.font = `${statSize}px sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillText(stat.icon, state.width * 0.25, y);

            ctx.font = `${statSize * 0.8}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.7)`;
            ctx.fillText(stat.label, state.width * 0.32, y);

            ctx.textAlign = 'right';
            ctx.font = `bold ${statSize}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = theme.textColor;
            ctx.fillText(stat.value, state.width * 0.75, y);
          });

          // Back button
          this.drawButton(ctx, state.width / 2, state.height * 0.88, 'Back', 'back');

          ctx.restore();
        },

        formatTime(seconds) {
          const hrs = Math.floor(seconds / 3600);
          const mins = Math.floor((seconds % 3600) / 60);
          const secs = Math.floor(seconds % 60);
          if (hrs > 0) {
            return `${hrs}h ${mins}m`;
          }
          return `${mins}m ${secs}s`;
        },

        drawTutorial(ctx) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
          ctx.fillRect(0, 0, state.width, state.height);

          const theme = THEMES[state.settings.theme];

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Title
          const titleSize = Math.min(40, state.height * 0.08);
          ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = theme.textColor;
          ctx.fillText('How To Play', state.width / 2, state.height * 0.1);

          // Tutorial steps
          const stepSize = titleSize * 0.45;
          const steps = [
            { icon: '👆', text: 'Tap anywhere to start a chain reaction' },
            { icon: '💥', text: 'Balls that touch your pop will also explode' },
            { icon: '🎯', text: 'Pop at least the target number to win' },
            { icon: '⭐', text: 'Pop more balls for higher star ratings' },
            { icon: '🔥', text: 'Build combos for bonus points' },
            { icon: '💡', text: 'Look for special balls with bonus effects!' }
          ];

          const startY = state.height * 0.2;
          const spacing = state.height * 0.11;

          steps.forEach((step, i) => {
            const y = startY + i * spacing;

            ctx.font = `${stepSize * 1.2}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(step.icon, state.width * 0.15, y);

            ctx.font = `${stepSize}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillStyle = theme.textColor;
            ctx.fillText(step.text, state.width * 0.22, y);
          });

          // Special ball types
          ctx.font = `bold ${stepSize}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('Special Balls:', state.width / 2, state.height * 0.78);

          ctx.font = `${stepSize * 0.8}px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(${theme.textColor === '#ffffff' ? '255,255,255' : '0,0,0'}, 0.8)`;
          ctx.fillText('$ = 3x points   💣 = Chain explosion   ❄ = Stationary   ⚡ = Speed bonus', state.width / 2, state.height * 0.84);

          // Start button
          this.drawButton(ctx, state.width / 2, state.height * 0.92, "Let's Play!", 'startFromTutorial');

          ctx.restore();
        }
      };

      // ============================================
      // GAME LOGIC
      // ============================================
      const Game = {
        init() {
          state.canvas = document.getElementById('gameCanvas');
          state.ctx = state.canvas.getContext('2d');

          // Load saved data
          state.highScore = Storage.loadHighScore();
          const savedSettings = Storage.loadSettings();
          if (savedSettings) {
            state.settings = { ...state.settings, ...savedSettings };
          }

          // Load stats
          const savedStats = Storage.loadStats();
          if (savedStats) {
            state.stats = { ...state.stats, ...savedStats };
          }

          // Load unlocks
          const savedUnlocks = Storage.loadUnlocks();
          if (savedUnlocks) {
            state.unlocks = { ...state.unlocks, ...savedUnlocks };
          }

          // Check if tutorial has been seen
          state.tutorialSeen = Storage.loadTutorialSeen();
          if (!state.tutorialSeen) {
            state.gameState = 'tutorial';
          }

          // Track session start time
          state.sessionStartTime = Date.now();

          // Initialize audio
          Audio.init();

          // Setup canvas
          this.resize();
          window.addEventListener('resize', () => this.resize());

          // Setup input handlers
          state.canvas.addEventListener('click', (e) => this.handleClick(e));
          state.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
          state.canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: false });

          // Keyboard controls
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
              if (state.gameState === 'playing') {
                state.gameState = 'paused';
              } else if (state.gameState === 'paused') {
                state.gameState = 'playing';
              }
            }
          });

          // Save play time on page unload
          window.addEventListener('beforeunload', () => {
            const sessionTime = (Date.now() - state.sessionStartTime) / 1000;
            state.stats.totalPlayTime += sessionTime;
            Storage.saveStats(state.stats);
          });

          // Start game loop
          this.loop(0);
        },

        resize() {
          state.dpr = window.devicePixelRatio || 1;
          state.width = window.innerWidth;
          state.height = window.innerHeight;

          state.canvas.width = state.width * state.dpr;
          state.canvas.height = state.height * state.dpr;
          state.canvas.style.width = state.width + 'px';
          state.canvas.style.height = state.height + 'px';

          state.ctx.scale(state.dpr, state.dpr);

          // Update body background
          document.body.style.backgroundColor = THEMES[state.settings.theme].background;
        },

        handleClick(e) {
          const rect = state.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          this.processInput(x, y);
        },

        handleTouchStart(e) {
          e.preventDefault();
          state.touchStartTime = Date.now();
          Audio.resume();
        },

        handleTouchEnd(e) {
          e.preventDefault();

          // Ensure it's a tap, not a swipe
          if (Date.now() - state.touchStartTime > 500) return;

          const touch = e.changedTouches[0];
          const rect = state.canvas.getBoundingClientRect();
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;
          this.processInput(x, y);
        },

        processInput(x, y) {
          state.buttons = state.buttons || {};

          // Check button clicks based on game state
          if (state.gameState === 'tutorial') {
            if (this.isButtonClick('startFromTutorial', x, y)) {
              state.tutorialSeen = true;
              Storage.saveTutorialSeen();
              state.gameState = 'menu';
            }
          } else if (state.gameState === 'menu') {
            if (this.isButtonClick('play', x, y)) {
              state.gameMode = 'classic';
              this.startGame(1);
            } else if (this.isButtonClick('modeSelect', x, y)) {
              state.gameState = 'modeSelect';
            } else if (this.isButtonClick('levelSelect', x, y)) {
              state.gameState = 'levelSelect';
            } else if (this.isButtonClick('stats', x, y)) {
              state.gameState = 'stats';
            } else if (this.isButtonClick('settings', x, y)) {
              state.gameState = 'settings';
            }
          } else if (state.gameState === 'modeSelect') {
            if (this.isButtonClick('mode_classic', x, y)) {
              state.gameMode = 'classic';
              this.startGame(1);
            } else if (this.isButtonClick('mode_timeAttack', x, y)) {
              state.gameMode = 'timeAttack';
              this.startTimeAttack();
            } else if (this.isButtonClick('mode_zen', x, y)) {
              state.gameMode = 'zen';
              this.startZenMode();
            } else if (this.isButtonClick('mode_precision', x, y)) {
              state.gameMode = 'precision';
              this.startGame(1);
            } else if (this.isButtonClick('back', x, y)) {
              state.gameState = 'menu';
            }
          } else if (state.gameState === 'stats') {
            if (this.isButtonClick('back', x, y)) {
              state.gameState = 'menu';
            }
          } else if (state.gameState === 'playing') {
            this.handleGameClick(x, y);
          } else if (state.gameState === 'paused') {
            if (this.isButtonClick('resume', x, y)) {
              state.gameState = 'playing';
            } else if (this.isButtonClick('restart', x, y)) {
              if (state.gameMode === 'timeAttack') {
                this.startTimeAttack();
              } else if (state.gameMode === 'zen') {
                this.startZenMode();
              } else {
                this.startGame(1);
              }
            } else if (this.isButtonClick('mainMenu', x, y)) {
              state.gameState = 'menu';
            }
          } else if (state.gameState === 'levelComplete') {
            if (this.isButtonClick('chooseUpgrade', x, y)) {
              state.gameState = 'upgradeSelect';
            } else if (this.isButtonClick('skipUpgrade', x, y)) {
              this.startGame(state.level + 1);
            }
          } else if (state.gameState === 'upgradeSelect') {
            this.handleUpgradeClick(x, y);
          } else if (state.gameState === 'gameOver') {
            if (this.isButtonClick('restart', x, y)) {
              if (state.gameMode === 'timeAttack') {
                this.startTimeAttack();
              } else if (state.gameMode === 'zen') {
                this.startZenMode();
              } else {
                this.startGame(1);
              }
            } else if (this.isButtonClick('mainMenu', x, y)) {
              state.gameState = 'menu';
            }
          } else if (state.gameState === 'settings') {
            this.handleSettingsClick(x, y);
          } else if (state.gameState === 'levelSelect') {
            this.handleLevelSelectClick(x, y);
          }
        },

        isButtonClick(id, x, y) {
          const btn = state.buttons[id];
          if (!btn) return false;
          return x >= btn.x && x <= btn.x + btn.width &&
                 y >= btn.y && y <= btn.y + btn.height;
        },

        handleGameClick(x, y) {
          if (state.clicks >= 1) return;

          state.clicks++;
          Audio.resume();

          // Determine if using mega ball
          const useMegaBall = state.upgrades.megaBallAvailable;
          if (useMegaBall) {
            state.upgrades.megaBallAvailable = false;
          }

          // Calculate max radius based on upgrades
          const maxRadius = useMegaBall
            ? LevelSystem.getMegaBallRadius()
            : LevelSystem.getPlayerMaxRadius();

          // Create player ball
          const theme = THEMES[state.settings.theme];
          const playerBall = new Ball(x, y, true, {
            color: useMegaBall ? '#ffd700' : theme.ballColors[0],
            radius: CONFIG.BASE_RADIUS,
            maxRadius: maxRadius,
            isMegaBall: useMegaBall
          });

          // Make mega ball glow extra bright
          if (useMegaBall) {
            playerBall.glowIntensity = 1.5;
          }

          state.balls.push(playerBall);

          // Add ripple effect
          state.ripples.push(new Ripple(x, y));

          // Haptic feedback (stronger for mega ball)
          if (useMegaBall) {
            Haptic.levelUp();
            Audio.playLevelUp();
          } else {
            Haptic.pop();
            Audio.playPop(1.2);
          }
        },

        handleUpgradeClick(x, y) {
          let upgradeChosen = false;

          if (this.isButtonClick('upgrade_balls', x, y)) {
            // More balls, but smaller radius
            state.upgrades.bonusBalls += 3;
            state.upgrades.radiusBonus -= 0.10; // -10% radius
            upgradeChosen = true;
            Audio.playPop(0.8);
          } else if (this.isButtonClick('upgrade_radius', x, y)) {
            // Bigger explosion radius
            state.upgrades.radiusBonus += 0.15; // +15% radius
            upgradeChosen = true;
            Audio.playPop(1.2);
          } else if (this.isButtonClick('upgrade_mega', x, y) && !state.upgrades.megaBallAvailable) {
            // Mega ball (one-time use)
            state.upgrades.megaBallAvailable = true;
            upgradeChosen = true;
            Audio.playLevelUp();
          }

          if (upgradeChosen) {
            Haptic.combo();
            this.startGame(state.level + 1);
          }
        },

        handleSettingsClick(x, y) {
          if (this.isButtonClick('back', x, y)) {
            Storage.saveSettings(state.settings);
            state.gameState = 'menu';
            return;
          }

          if (this.isButtonClick('sound', x, y)) {
            state.settings.soundEnabled = !state.settings.soundEnabled;
            if (state.settings.soundEnabled) Audio.playPop();
          } else if (this.isButtonClick('vibration', x, y)) {
            state.settings.vibrationEnabled = !state.settings.vibrationEnabled;
            if (state.settings.vibrationEnabled) Haptic.pop();
          } else if (this.isButtonClick('particles', x, y)) {
            state.settings.particlesEnabled = !state.settings.particlesEnabled;
          }

          // Check theme buttons
          Object.keys(THEMES).forEach(key => {
            if (this.isButtonClick(`theme_${key}`, x, y)) {
              // Only allow selecting unlocked themes
              if (LevelSystem.isThemeUnlocked(key)) {
                state.settings.theme = key;
                document.body.style.backgroundColor = THEMES[key].background;
              } else {
                // Play a "locked" sound or haptic
                Haptic.pop();
              }
            }
          });
        },

        handleLevelSelectClick(x, y) {
          if (this.isButtonClick('back', x, y)) {
            state.gameState = 'menu';
            return;
          }

          // Check level buttons
          for (let i = 1; i <= 20; i++) {
            if (this.isButtonClick(`level_${i}`, x, y)) {
              this.startGame(i);
              return;
            }
          }
        },

        startGame(level) {
          state.level = level;
          state.clicks = 0;
          state.numPopped = 0;
          state.combo = 0;
          state.maxCombo = 0;
          state.lastPopTime = 0;
          state.balls = [];
          state.particles = [];
          state.ripples = [];
          state.floatingTexts = [];
          state.confetti = [];
          state.levelScore = 0;
          state.stars = 0;

          // Reset effects
          state.screenShake = { active: false, intensity: 0, duration: 0, startTime: 0 };
          state.slowMo = { active: false, factor: 1, duration: 0, startTime: 0 };

          // Show random tip
          state.showTip = Math.random() < 0.5;
          state.currentTip = TIPS[Math.floor(Math.random() * TIPS.length)];

          if (level === 1) {
            state.score = 0;
            state.streak = 0;
            // Reset all upgrades when starting fresh
            state.upgrades = {
              bonusBalls: 0,
              radiusBonus: 0,
